
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Commsource - Live Click Fix</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #ffffff;
        }
        .screen {
            position: relative;
            width: 864px;
            height: 1536px;
            margin: 0 auto;
        }
        .screen img {
            width: 864px;
            height: 1536px;
            display: block;
        }
        .click-zone {
            position: absolute;
            cursor: pointer;
        }
        #welcome, #guest {
            display: none;
        }
        .placeholder {
            width: 864px;
            height: 1536px;
            background: #e0f5e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<!-- Splash Screen -->
<div class="screen" id="splash">
    <img src="FFC481BA-E48E-416D-89F5-B63F5D61E41B.jpeg" alt="Splash">
    <div class="click-zone" style="left: 276px; top: 1275px; width: 312px; height: 90px;" onclick="showScreen('welcome')"></div>
</div>

<!-- Welcome Screen -->
<div class="screen" id="welcome">
    <img src="17F21978-4963-4C3B-805A-A8CD4A0EA16F.jpeg" alt="Welcome">
    <div class="click-zone" style="left: 276px; top: 660px; width: 312px; height: 90px;" onclick="showScreen('guest')"></div>
</div>

<!-- Guest Screen -->
<div class="screen" id="guest">
    <div class="placeholder">Welcome, Guest! (Placeholder)</div>
</div>

<script>
    function showScreen(id) {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('welcome').style.display = 'none';
        document.getElementById('guest').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }
</script>

</body>
</html>
